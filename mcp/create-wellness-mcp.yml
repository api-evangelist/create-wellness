constraints:
- >-
  Checkout requires contemporaneous human approval — robots.txt and llms.txt
  both state agents must not complete payment without explicit buyer consent.
- The MCP endpoint is rate-limited per IP; agents are told to back off on 429.
- >-
  All prices are integers in ISO 4217 minor units paired with a currency code
  ({"amount":600,"currency":"USD"} is $6.00).
provenance_note: >-
  This MCP server is provided by the Shopify platform, not authored by Create
  Wellness. It is nonetheless served from the brand's own host and advertised
  from the brand's own robots.txt, llms.txt and agents.md, so it is a real,
  callable agent surface on trycreate.co.
