apis:
- name: Create Wellness UCP Commerce MCP
  description: 'The Universal Commerce Protocol endpoint served from the Create Wellness
    storefront, exposed over the Model Context Protocol. Thirteen tools cover catalog
    search and lookup, cart create/read/update/cancel, checkout create/read/update/complete/cancel,
    and order retrieval. It answers anonymously — no API key, no OAuth challenge —
    with each tool requiring only a self-asserted agent profile URI in meta. Prices
    are integers in ISO 4217 minor units. Only complete_checkout requires an idempotency
    key, and the store states that payment must never be finalized without explicit,
    contemporaneous human approval. The surface is Shopify platform infrastructure
    rather than something the brand authored, but it is served from the brand''s own
    host and advertised from the brand''s own agent instructions.'
  humanURL: https://trycreate.co/agents.md
  baseURL: https://trycreate.co/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - E-Commerce
  - Catalog
  - Checkout
