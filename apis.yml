aid: create-wellness
name: Create Wellness
description: 'Create Wellness is a New York based direct-to-consumer supplement brand,
  founded in 2022, that makes creatine monohydrate gummies and drink mixes — NSF Certified
  for Sport, vegan, gluten-free and non-GMO — sold through its own Shopify storefront
  at trycreate.co and through Amazon, Target, Walmart, GNC and The Vitamin Shoppe.
  It is not a software company and publishes no developer programme, but its storefront
  serves a live, anonymous agent-commerce surface: a Universal Commerce Protocol
  endpoint exposed over the Model Context Protocol at /api/ucp/mcp with thirteen
  catalog, cart, checkout and order tools, advertised from the store''s own robots.txt,
  llms.txt and agents.md, and governed by a stated human-approval-before-payment rule.'
image: https://cdn.shopify.com/s/files/1/0611/9204/4732/files/Create_Wellness_Logo.png?v=1733357143
url: https://raw.githubusercontent.com/api-evangelist/create-wellness/refs/heads/main/apis.yml
